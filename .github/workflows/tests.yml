name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate

  checkov:
    name: Checkov (least-privilege proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: scan
        run: checkov --config-file .checkov.yaml

  enforcement-logic:
    name: prove-enforcement verdict logic
    runs-on: ubuntu-latest
    # The script itself cannot run without an AWS account, which means the part
    # most likely to be wrong, the branching on what AWS actually said, would
    # ship unexercised. This feeds real AWS error strings through the verdict
    # function and asserts each classification.
    #
    # Notably it pins that a bare "AccessDenied" is NOT a pass: if the role's
    # own policy did the blocking, the boundary was never exercised and could
    # be missing entirely.
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prove-enforcement.sh --self-test
